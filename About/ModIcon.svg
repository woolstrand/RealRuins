<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Real Ruins mod icon. Source for About/ModIcon.png (64x64). Line art in grays on transparent background. -->
  <defs>
    <clipPath id="wall">
      <path id="wallShape" d="M7 53 V12 H17 V18 L21 21 L24 19 L27 27 L30 29 L29 39 H46 L48 43 L51 41 L54 46 V53 Z"/>
    </clipPath>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- wall panel seams (inner detail, dimmer) -->
    <g clip-path="url(#wall)" stroke="#9a9a9a" stroke-width="1.5">
      <path d="M0 27 H64 M0 41 H64 M19 27 V41 M13 41 V53 M25 41 V53 M38 41 V53"/>
    </g>
    <!-- wall outline -->
    <use href="#wallShape" stroke="#e0e0e0" stroke-width="2.5"/>
    <!-- status light / vent -->
    <rect x="11" y="31" width="5" height="5" rx="1" stroke="#bdbdbd" stroke-width="1.5"/>

    <!-- dish pedestal standing on the wall -->
    <path d="M30 39 L34 29 H39 L43 39 Z" fill="#5a5a5a" stroke="#e0e0e0" stroke-width="2"/>

    <!-- satellite dish facing upper right, chipped rim -->
    <path d="M51.6 31.7 Q31 31 30.3 10.4 L31.5 14 L35 15.1 L35.5 18.5 L38.5 18.6 Z" fill="#808080" stroke="#e0e0e0" stroke-width="2.5"/>

    <!-- four support beams to the receiver -->
    <path d="M51.6 31.7 L48.7 13.3 M30.3 10.4 L48.7 13.3" stroke="#d0d0d0" stroke-width="1.5"/>
    <path d="M45.2 25.3 L48.7 13.3 M36.7 16.8 L48.7 13.3" stroke="#a0a0a0" stroke-width="1.2"/>
    <!-- receiver -->
    <circle cx="48.7" cy="13.3" r="2.4" fill="#e0e0e0"/>

    <!-- ground -->
    <path d="M4 53 H60" stroke="#e0e0e0" stroke-width="2.5"/>
  </g>
</svg>
